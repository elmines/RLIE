data_roots:
  - real/headline_binary

generation:
  sample_size: 20
  rules_per_call: 5

num_train_samples: null
num_valid_samples: null
num_test_samples: null
data_seed: 42
repeat: 1

max_rules: 10
rule_prune_metric: acc
rule_coverage_threshold: 0.2
model_selection_metric: acc
best_model_metric: acc

# llm: original pipeline. LLM ternary scores are the logistic-regression features.
# bert_static: train one MLP per rule on precomputed BERT [CLS] embeddings.
#   Embed first with: python -m rlie.bert --config configs/default.yaml
# bert_dynamic: fine-tune BERT together with one MLP per rule. Later rounds keep
#   the BERT weights and any MLP already trained for a rule.
# After an llm run, train BERT on the retained hypotheses with:
#   python -m rlie.train_retained --config configs/default.yaml --run-dir <run>
# feature_mode: llm
feature_mode: bert_dynamic

# Paths are relative to the working directory. BERT, the rule-MLP head, and the
# logistic-regression hyperparameters live in their own files.
bert_config: configs/bert.yaml
head_config: configs/head.yaml
sklearn_config: configs/elastic_net.yaml

evaluation:
  modes: regression_only

llms:
  generation:
    rule_learning_model: openai/gpt-oss-20b
    evaluation_models:
      - openai/gpt-oss-20b
    temperature: 0.0
    max_tokens: 8000
    max_retries: 3
  evaluation:
    temperature: 0.0
    request_timeout: 300
    num_predict: 8000
    max_concurrent_per_key: 32
    max_retries: 5
    reasoning_effort: low
    disable_thinking_models: []
    reasoning_effort_models: {}
    chat_template_kwargs_models: {}
  client:
    base_url: 'http://0.0.0.0:8002/v1' # ${RLIE_BASE_URL}
    api_key: 'derf' #${RLIE_API_KEY}

convergence:
  min_improvement: 0.001
  max_rounds: 20
  patience: 3

logging:
  output_dir: outputs
  save_features: true
  print_generation_prompts: false
