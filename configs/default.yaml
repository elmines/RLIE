data_roots:
  - real/headline_binary

generation:
  sample_size: 20
  rules_per_call: 5

num_train_samples: null
num_valid_samples: null
num_test_samples: null
data_seed: 42
repeat: 1

max_rules: 10
rule_prune_metric: acc
rule_coverage_threshold: 0.2
model_selection_metric: acc
best_model_metric: acc

# llm: original pipeline. LLM ternary scores are the logistic-regression features.
# bert_mlp: train one MLP per rule on precomputed BERT [CLS] embeddings to imitate
# those ternary scores, then feed the continuous MLP outputs in [-1, 1] to
# logistic regression. Embed first with: python -m rlie.bert --config configs/default.yaml
# feature_mode: llm
feature_mode: bert_mlp

bert:
  embeddings_dir: embeddings/modbert
  model_name: answerdotai/ModernBERT-base
  max_length: 8192
  batch_size: 16
  device: cuda:0
  # Rule MLPs run here. Point this at a GPU that is not serving the LLM.
  mlp_device: cuda:0
  mlp:
    hidden_dims: [128]
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    max_epochs: 50
    patience: 5
    min_delta: 0.0001
    metric: mse

evaluation:
  modes: regression_only

llms:
  generation:
    rule_learning_model: openai/gpt-oss-20b
    evaluation_models:
      # - deepseek-chat
      - openai/gpt-oss-20b
    temperature: 0.0
    max_tokens: 8000
    max_retries: 3
  evaluation:
    temperature: 0.0
    request_timeout: 300
    num_predict: 8000
    max_concurrent_per_key: 4
    max_retries: 5
    disable_thinking_models: []
    reasoning_effort_models: {}
    chat_template_kwargs_models: {}
  client:
    base_url: 'http://0.0.0.0:8001/v1' # ${RLIE_BASE_URL}
    api_key: 'derf' #${RLIE_API_KEY}

convergence:
  min_improvement: 0.001
  max_rounds: 20
  patience: 3

elastic_net:
  max_iter: 20000
  tol: 0.001
  fit_intercept: true
  warm_start: false
  class_weight: balanced
  random_state: 42
  cv_folds: 5
  n_jobs: -1

logging:
  output_dir: outputs
  save_features: true
  print_generation_prompts: false
