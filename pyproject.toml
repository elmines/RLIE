[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlie"
version = "0.1.0"
description = "Rule Learning via Iterative Estimation for interpretable text classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "colorlog>=6.8.0",
  "flashinfer-jit-cache>=0.6.18.post1",
  "flashinfer-python>=0.7.2",
  "gradnorm-pytorch>=0.2.3",
  "numpy>=1.24.0",
  "openai>=1.40.0",
  "pandas>=2.0.0",
  "PyYAML>=6.0.0",
  "scikit-learn>=1.3.0",
  "tqdm>=4.66.0",
  "transformers<5",
  "vllm>=0.11.0",
  "vllm-router>=0.1.16",
]

[tool.uv.sources]
flashinfer-jit-cache = { index = "flashinfer" }

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/cu130/"
explicit = true

[project.scripts]
rlie-train = "rlie.main:main"
rlie-eval = "rlie.run_eval_only:main"
rlie-embed = "rlie.bert.__main__:main"
rlie-train-retained = "rlie.train_retained:main"

[tool.setuptools.packages.find]
include = ["rlie*"]
